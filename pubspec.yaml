name: gymassistant
description: "Android app that analyses gym technique on three machines through the phone camera."
publish_to: 'none'

# build-name becomes the Android versionName and build-number the versionCode.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_svg: ^2.5.1
  go_router: ^18.1.4
  intl: any
  permission_handler: 12.0.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  # Generates AppLocalizations from the ARB files in lib/l10n (see l10n.yaml).
  generate: true
  assets:
    # Neutral machine illustrations for P06; placeholders until the final ones.
    - assets/exercises/
  # Android product flavor used when no --flavor is given (ADR-0013).
  default-flavor: play
